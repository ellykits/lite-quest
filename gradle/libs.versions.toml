[versions]
agp = "9.0.1"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activityCompose = "1.13.0"
androidx-core-ktx = "1.18.0"
androidx-lifecycle-viewmodel = "2.10.0"
androidx-navigation = "2.9.2"
componentsResources = "1.11.0"
compose-plugin = "1.11.0"
kotlin = "2.3.21"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
ktor = "3.5.0"
material3 = "1.9.0"
materialIconsCore = "1.7.3"
maven-publish = "0.36.0"
compose-multiplatform = "1.11.0"
spotless = "8.5.1"
ktlint = "1.0.1"
kscan = "0.9.1"
filekit = "0.14.1"
lucide = "1.1.0"
coil3 = "3.4.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle-viewmodel" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle-viewmodel" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }

androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "componentsResources" }
foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "materialIconsCore" }
lucide = { module = "com.composables:icons-lucide", version.ref = "lucide" }
kscan = { module = "io.github.ismai117:KScan", version.ref = "kscan" }
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
spotless-plugin-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
androidApplication              = { id = "com.android.application",                        version.ref = "agp" }
androidMultiplatformLibrary     = { id = "com.android.kotlin.multiplatform.library",        version.ref = "agp" }
kotlinJvm                       = { id = "org.jetbrains.kotlin.jvm",                        version.ref = "kotlin" }
kotlinMultiplatform             = { id = "org.jetbrains.kotlin.multiplatform",              version.ref = "kotlin" }
kotlinSerialization             = { id = "org.jetbrains.kotlin.plugin.serialization",       version.ref = "kotlin" }
composeMultiplatform            = { id = "org.jetbrains.compose",                           version.ref = "compose-plugin" }
composeCompiler                 = { id = "org.jetbrains.kotlin.plugin.compose",             version.ref = "kotlin" }
maven-publish                   = { id = "com.vanniktech.maven.publish",                    version.ref = "maven-publish" }
spotless                        = { id = "com.diffplug.spotless",                           version.ref = "spotless" }

